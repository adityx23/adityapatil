<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">STM32 mobile robot control architecture</title>
  <desc id="desc">Raspberry Pi route executor communicates with an STM32 controller that reads encoders and drives motor and steering outputs through safety gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#15233a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69b7ff"/></marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <text x="70" y="80" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="34" font-weight="700">STM32 Robot Control Stack</text>
  <text x="70" y="120" fill="#9fb0c8" font-family="Arial, sans-serif" font-size="18">Safe route execution from Linux planning to deterministic embedded actuation</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="225" width="240" height="180" rx="22" fill="#172941" stroke="#69b7ff" stroke-width="2"/>
    <text x="190" y="275" text-anchor="middle" fill="#dceeff" font-size="23" font-weight="700">Raspberry Pi</text>
    <text x="190" y="310" text-anchor="middle" fill="#aab8cc" font-size="17">Linux route executor</text>
    <text x="190" y="342" text-anchor="middle" fill="#aab8cc" font-size="17">Arming + logging</text>
    <text x="190" y="374" text-anchor="middle" fill="#aab8cc" font-size="17">Serial / USB CDC</text>
    <rect x="480" y="180" width="270" height="270" rx="22" fill="#211d46" stroke="#9f8cff" stroke-width="2"/>
    <text x="615" y="230" text-anchor="middle" fill="#ece8ff" font-size="24" font-weight="700">STM32 MCU</text>
    <text x="615" y="270" text-anchor="middle" fill="#c4b9f8" font-size="17">Arm-before-move gate</text>
    <text x="615" y="304" text-anchor="middle" fill="#c4b9f8" font-size="17">PWM / timer drivers</text>
    <text x="615" y="338" text-anchor="middle" fill="#c4b9f8" font-size="17">Encoder feedback</text>
    <text x="615" y="372" text-anchor="middle" fill="#c4b9f8" font-size="17">Motion primitives</text>
    <text x="615" y="406" text-anchor="middle" fill="#c4b9f8" font-size="17">Fault isolation</text>
    <rect x="920" y="190" width="210" height="120" rx="22" fill="#14342f" stroke="#68d5a5" stroke-width="2"/>
    <text x="1025" y="238" text-anchor="middle" fill="#d8fff1" font-size="22" font-weight="700">Drive Motor</text>
    <text x="1025" y="274" text-anchor="middle" fill="#a9dfcb" font-size="17">PWM + encoder</text>
    <rect x="920" y="360" width="210" height="120" rx="22" fill="#14342f" stroke="#68d5a5" stroke-width="2"/>
    <text x="1025" y="408" text-anchor="middle" fill="#d8fff1" font-size="22" font-weight="700">Steering Servo</text>
    <text x="1025" y="444" text-anchor="middle" fill="#a9dfcb" font-size="17">Calibrated PWM</text>
  </g>
  <g stroke="#69b7ff" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M310 315 H465"/>
    <path d="M750 270 H905"/>
    <path d="M750 390 H905"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#92cfff" font-size="15" font-weight="700">
    <text x="387" y="300" text-anchor="middle">commands</text>
    <text x="828" y="255" text-anchor="middle">safe actuation</text>
    <text x="828" y="375" text-anchor="middle">safe actuation</text>
  </g>
  <rect x="70" y="535" width="1060" height="78" rx="18" fill="#0e192a" stroke="#2f4561"/>
  <text x="600" y="568" text-anchor="middle" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="18" font-weight="700">Validated motion primitives</text>
  <text x="600" y="596" text-anchor="middle" fill="#aab8cc" font-family="Arial, sans-serif" font-size="16">~15.24 cm straight increments · ~59.73° turns · 3 consecutive full route runs in a 5-run reliability test</text>
</svg>
