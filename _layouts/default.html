<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#0b1220">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ site.baseurl }}/assets/favicon.svg" type="image/svg+xml">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/og-cover.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:image" content="{{ '/assets/og-cover.png' | absolute_url }}">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Aditya Patil",
      "url": "{{ site.url }}{{ site.baseurl }}/",
      "email": "mailto:aditya.a.patil2@gmail.com",
      "jobTitle": "M.S. Robotics Student and AI4CE Researcher",
      "affiliation": [
        {"@type": "CollegeOrUniversity", "name": "New York University"},
        {"@type": "Organization", "name": "AI4CE Lab"}
      ],
      "sameAs": [
        "https://github.com/adityx23",
        "https://www.linkedin.com/in/aditya-patil-4a5735217"
      ]
    }
    </script>

    <title>{% if page.title and page.title != site.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/custom.css?v=4">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="nav-shell">
        <a class="site-brand" href="{{ site.baseurl }}/" aria-label="Aditya Patil home">
          <span class="brand-mark" aria-hidden="true">AP</span>
          <span>Aditya Patil</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ site.baseurl }}/">Home</a>
          <a href="{{ site.baseurl }}/projects">Projects</a>
          <a href="{{ site.baseurl }}/skills">Skills</a>
          <a href="{{ site.baseurl }}/resume.pdf">R&eacute;sum&eacute;</a>
          <a href="https://github.com/adityx23" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-shell">
        <div>
          <strong>Aditya Patil</strong>
          <p>NYU M.S. Robotics &middot; Robotics systems, embedded control, and autonomy</p>
        </div>
        <div class="footer-links">
          <a href="mailto:aditya.a.patil2@gmail.com">Email</a>
          <a href="https://www.linkedin.com/in/aditya-patil-4a5735217" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://github.com/adityx23" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
      </div>
    </footer>
  </body>
</html>
